coordinate_convention:
  x: "forward"
  y: "right"
  z: "up"
  angles: "degrees"

sensors:
  - name: "lidar_top"
    blueprint: "sensor.lidar.ray_cast"
    group: "exteroception"
    required: false
    transform: {x: 0.0, y: 0.0, z: 1.90, roll: 0.0, pitch: 0.0, yaw: 0.0}
    attributes:
      channels: 32
      range: 70.0
      points_per_second: 700000
      rotation_frequency: 20.0
      horizontal_fov: 360.0
      upper_fov: 10.0
      lower_fov: -30.0
      noise_stddev: 0.02
      dropoff_general_rate: 0.05
      dropoff_intensity_limit: 0.8
      dropoff_zero_intensity: 0.2
      sensor_tick: 0.05

  - name: "camera_front"
    blueprint: "sensor.camera.rgb"
    group: "camera_surround"
    required: false
    transform: {x: 1.30, y: 0.00, z: 1.68, roll: 0.0, pitch: -3.0, yaw: 0.0}
    attributes: &camera_attributes
      image_size_x: 960
      image_size_y: 540
      fov: 70.0
      sensor_tick: 0.10

  - name: "camera_front_right"
    blueprint: "sensor.camera.rgb"
    group: "camera_surround"
    required: false
    transform: {x: 0.75, y: 0.82, z: 1.65, roll: 0.0, pitch: -6.0, yaw: 55.0}
    attributes: *camera_attributes

  - name: "camera_back_right"
    blueprint: "sensor.camera.rgb"
    group: "camera_surround"
    required: false
    transform: {x: -0.75, y: 0.82, z: 1.65, roll: 0.0, pitch: -7.0, yaw: 110.0}
    attributes: *camera_attributes

  - name: "camera_back"
    blueprint: "sensor.camera.rgb"
    group: "camera_surround"
    required: false
    transform: {x: -1.65, y: 0.00, z: 1.58, roll: 0.0, pitch: -6.0, yaw: 180.0}
    attributes:
      image_size_x: 960
      image_size_y: 540
      fov: 110.0
      sensor_tick: 0.10

  - name: "camera_back_left"
    blueprint: "sensor.camera.rgb"
    group: "camera_surround"
    required: false
    transform: {x: -0.75, y: -0.82, z: 1.65, roll: 0.0, pitch: -7.0, yaw: -110.0}
    attributes: *camera_attributes

  - name: "camera_front_left"
    blueprint: "sensor.camera.rgb"
    group: "camera_surround"
    required: false
    transform: {x: 0.75, y: -0.82, z: 1.65, roll: 0.0, pitch: -6.0, yaw: -55.0}
    attributes: *camera_attributes

  - name: "radar_front"
    blueprint: "sensor.other.radar"
    group: "radar_surround"
    required: false
    transform: {x: 2.25, y: 0.00, z: 0.55, roll: 0.0, pitch: 0.0, yaw: 0.0}
    attributes: &radar_attributes
      horizontal_fov: 100.0
      vertical_fov: 20.0
      points_per_second: 3000
      range: 120.0
      sensor_tick: 0.05

  - name: "radar_front_right"
    blueprint: "sensor.other.radar"
    group: "radar_surround"
    required: false
    transform: {x: 1.90, y: 0.76, z: 0.55, roll: 0.0, pitch: 0.0, yaw: 70.0}
    attributes: *radar_attributes

  - name: "radar_back_right"
    blueprint: "sensor.other.radar"
    group: "radar_surround"
    required: false
    transform: {x: -2.05, y: 0.76, z: 0.55, roll: 0.0, pitch: 0.0, yaw: 145.0}
    attributes: *radar_attributes

  - name: "radar_back_left"
    blueprint: "sensor.other.radar"
    group: "radar_surround"
    required: false
    transform: {x: -2.05, y: -0.76, z: 0.55, roll: 0.0, pitch: 0.0, yaw: -145.0}
    attributes: *radar_attributes

  - name: "radar_front_left"
    blueprint: "sensor.other.radar"
    group: "radar_surround"
    required: false
    transform: {x: 1.90, y: -0.76, z: 0.55, roll: 0.0, pitch: 0.0, yaw: -70.0}
    attributes: *radar_attributes

  - name: "gnss_roof"
    blueprint: "sensor.other.gnss"
    group: "localization"
    required: true
    transform: {x: -0.30, y: 0.00, z: 1.82, roll: 0.0, pitch: 0.0, yaw: 0.0}
    attributes:
      noise_alt_stddev: 2.50
      noise_lat_stddev: 0.0000135
      noise_lon_stddev: 0.0000135
      noise_alt_bias: 0.0
      noise_lat_bias: 0.0
      noise_lon_bias: 0.0
      noise_seed: 20260806
      sensor_tick: 0.05

  - name: "imu_center"
    blueprint: "sensor.other.imu"
    group: "localization"
    required: true
    transform: {x: 0.00, y: 0.00, z: 0.45, roll: 0.0, pitch: 0.0, yaw: 0.0}
    attributes:
      noise_accel_stddev_x: 0.05
      noise_accel_stddev_y: 0.05
      noise_accel_stddev_z: 0.08
      noise_gyro_stddev_x: 0.002
      noise_gyro_stddev_y: 0.002
      noise_gyro_stddev_z: 0.002
      noise_gyro_bias_x: 0.0
      noise_gyro_bias_y: 0.0
      noise_gyro_bias_z: 0.0005
      noise_seed: 20260806
      sensor_tick: 0.05
