perception:
  # Ağırlıklar, engine'ler ve worker image'ları doğrulanmadan true yapılmaz.
  enabled: false
  input_lifespan_s: 0.20
  snapshot_max_age_s: 0.75
  # Online frame verisi diske yazılmaz. CARLA callback belleğinden önceden ayrılmış
  # POSIX shared-memory slotuna tek host-copy yapılır. Worker container'ları ipc: host
  # kullanarak aynı segmenti açar ve CUDA stream'ine async H2D kopyalar.
  transport:
    mode: "shared_memory"
    shm_namespace: "l4stack_perception"
    slots_per_sensor: 8
    camera_slot_bytes: 2500000
    lidar_slot_bytes: 4194304
    allocation_timeout_s: 0.005

  # 20 Hz CARLA tick'i için GPU'ya ayrılan admission bütçesi. Bu değer gerçek RTX 5090
  # p95 ölçümleriyle benchmark sonrası kalibre edilir. max_concurrent=2, MPS altında
  # küçük TLD kernel'lerinin ağır BEV/MapTR işiyle kontrollü overlap etmesine izin verir.
  gpu:
    device_index: 0
    frame_budget_ms: 42.0
    max_concurrent: 2
    history_size: 128
    safety_margin: 1.15
    mps_required: true
    minimum_free_vram_gib: 4.0

  models:
    bevfusion_detection:
      enabled: false
      adapter: "bevfusion_detection"
      model_version: "nvidia-cuda-bevfusion-fp16-sm120"
      executor: "perception_bevfusion_detection"
      runtime_component: "perception_bevfusion_detection"
      target_rate_hz: 10.0
      request_timeout_s: 0.12
      max_sensor_skew_s: 0.10
      cameras: &surround_cameras
        - camera_front
        - camera_front_right
        - camera_back_right
        - camera_back
        - camera_back_left
        - camera_front_left
      lidar: "lidar_top"
      gpu:
        priority: 10
        execution_class: "CRITICAL"
        estimated_gpu_ms: 24.0
        deadline_ms: 80.0
        max_inflight: 1
      backend:
        command: ["bash", "models/perception/bevfusion_detection/run_backend.sh"]
        working_directory: "."
        required_environment: ["L4STACK_BEVFUSION_DETECTION_COMMAND"]
        startup_timeout_s: 180.0
        shutdown_timeout_s: 15.0
        environment:
          L4STACK_REQUIRE_CUDA: "1"
          L4STACK_DISABLE_CPU_FALLBACK: "1"
          L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
          CUDA_MODULE_LOADING: "LAZY"
      artifacts:
        - path: "models/perception/bevfusion_detection/model/bevfusion-det.pth"
          required: true
          min_size_bytes: 1048576
        - path: "models/perception/bevfusion_detection/model/bevfusion-det-sm120.engine"
          required: true
          min_size_bytes: 1048576

    tld_ready:
      enabled: false
      adapter: "tld_ready"
      model_version: "tld-ready-yolov8x-tensorrt-fp16-sm120"
      executor: "perception_tld_ready"
      runtime_component: "perception_tld_ready"
      target_rate_hz: 10.0
      request_timeout_s: 0.06
      max_sensor_skew_s: 0.10
      cameras:
        - camera_front
        - camera_front_right
        - camera_front_left
      lidar: null
      gpu:
        priority: 15
        execution_class: "CRITICAL"
        estimated_gpu_ms: 7.0
        deadline_ms: 50.0
        max_inflight: 1
      backend:
        command: ["bash", "models/perception/tld_ready/run_backend.sh"]
        working_directory: "."
        required_environment: ["L4STACK_TLD_READY_COMMAND"]
        startup_timeout_s: 90.0
        shutdown_timeout_s: 10.0
        environment:
          L4STACK_REQUIRE_CUDA: "1"
          L4STACK_DISABLE_CPU_FALLBACK: "1"
          L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
          CUDA_MODULE_LOADING: "LAZY"
      artifacts:
        - path: "models/perception/tld_ready/model/traffic_lights_yolov8x.pt"
          required: true
          min_size_bytes: 1048576
        - path: "models/perception/tld_ready/model/traffic_lights_yolov8x-sm120.engine"
          required: true
          min_size_bytes: 1048576

    maptrv2:
      enabled: false
      adapter: "maptrv2"
      model_version: "maptrv2-r50-bevpool-pytorch212-cu130-sm120"
      executor: "perception_maptrv2"
      runtime_component: "perception_maptrv2"
      target_rate_hz: 5.0
      request_timeout_s: 0.16
      max_sensor_skew_s: 0.12
      cameras: *surround_cameras
      lidar: null
      gpu:
        priority: 30
        execution_class: "REQUIRED"
        estimated_gpu_ms: 30.0
        deadline_ms: 160.0
        max_inflight: 1
      backend:
        command: ["bash", "models/perception/maptrv2/run_backend.sh"]
        working_directory: "."
        required_environment: ["L4STACK_MAPTRV2_COMMAND"]
        startup_timeout_s: 240.0
        shutdown_timeout_s: 15.0
        environment:
          L4STACK_REQUIRE_CUDA: "1"
          L4STACK_DISABLE_CPU_FALLBACK: "1"
          L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
          CUDA_MODULE_LOADING: "LAZY"
          PYTORCH_CUDA_ALLOC_CONF: "backend:cudaMallocAsync,expandable_segments:True"
      artifacts:
        - path: "models/perception/maptrv2/model/maptrv2_r50_bevpool_24ep.pth"
          required: true
          min_size_bytes: 1048576
        - path: "models/perception/maptrv2/model/rtx5090_port_verified.json"
          required: true
          min_size_bytes: 64

    bevfusion_segmentation:
      enabled: false
      adapter: "bevfusion_segmentation"
      model_version: "mit-bevfusion-seg-fp16-sm120"
      executor: "perception_bevfusion_segmentation"
      runtime_component: "perception_bevfusion_segmentation"
      target_rate_hz: 2.0
      request_timeout_s: 0.30
      max_sensor_skew_s: 0.12
      cameras: *surround_cameras
      lidar: "lidar_top"
      gpu:
        priority: 60
        execution_class: "OPPORTUNISTIC"
        estimated_gpu_ms: 38.0
        deadline_ms: 400.0
        max_inflight: 1
      backend:
        command: ["bash", "models/perception/bevfusion_segmentation/run_backend.sh"]
        working_directory: "."
        required_environment: ["L4STACK_BEVFUSION_SEGMENTATION_COMMAND"]
        startup_timeout_s: 180.0
        shutdown_timeout_s: 15.0
        environment:
          L4STACK_REQUIRE_CUDA: "1"
          L4STACK_DISABLE_CPU_FALLBACK: "1"
          L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
          CUDA_MODULE_LOADING: "LAZY"
      artifacts:
        - path: "models/perception/bevfusion_segmentation/model/bevfusion-seg.pth"
          required: true
          min_size_bytes: 1048576
        - path: "models/perception/bevfusion_segmentation/model/bevfusion-seg-sm120.engine"
          required: true
          min_size_bytes: 1048576

    citysemsegformer:
      enabled: false
      adapter: "citysemsegformer"
      model_version: "nvidia-citysemsegformer-trt11-fp16-sm120"
      executor: "perception_citysemsegformer"
      runtime_component: "perception_citysemsegformer"
      target_rate_hz: 2.0
      request_timeout_s: 0.25
      max_sensor_skew_s: 0.12
      cameras:
        - camera_front
        - camera_front_right
        - camera_front_left
      lidar: null
      gpu:
        priority: 70
        execution_class: "OPPORTUNISTIC"
        estimated_gpu_ms: 26.0
        deadline_ms: 400.0
        max_inflight: 1
      backend:
        command: ["bash", "models/perception/citysemsegformer/run_backend.sh"]
        working_directory: "."
        required_environment: ["L4STACK_CITYSEMSEGFORMER_COMMAND"]
        startup_timeout_s: 120.0
        shutdown_timeout_s: 10.0
        environment:
          L4STACK_REQUIRE_CUDA: "1"
          L4STACK_DISABLE_CPU_FALLBACK: "1"
          L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
          CUDA_MODULE_LOADING: "LAZY"
      artifacts:
        - path: "models/perception/citysemsegformer/model/citysemsegformer.onnx"
          required: true
          min_size_bytes: 1048576
        - path: "models/perception/citysemsegformer/model/citysemsegformer-sm120.engine"
          required: true
          min_size_bytes: 1048576
        - path: "models/perception/citysemsegformer/model/labels.txt"
          required: true
          min_size_bytes: 20
