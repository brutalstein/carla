name: l4stack-perception

x-gpu-common: &gpu-common
  ipc: host
  network_mode: none
  restart: unless-stopped
  user: "${L4STACK_UID:?set L4STACK_UID}:${L4STACK_GID:?set L4STACK_GID}"
  environment:
    CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
    CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-log
    CUDA_MODULE_LOADING: LAZY
    L4STACK_REQUIRE_CUDA: "1"
    L4STACK_DISABLE_CPU_FALLBACK: "1"
    L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
  volumes:
    - ../../:/workspace:rw
    - /tmp/nvidia-mps:/tmp/nvidia-mps:rw
    - /tmp/nvidia-log:/tmp/nvidia-log:rw
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  tensorrt-worker:
    <<: *gpu-common
    container_name: l4stack-perception-trt
    build:
      context: ../..
      dockerfile: infra/perception/images/Dockerfile.tensorrt
    image: l4stack/perception-tensorrt:11.1-cu13.3
    shm_size: 1gb

  tld-worker:
    <<: *gpu-common
    container_name: l4stack-perception-tld
    build:
      context: ../..
      dockerfile: infra/perception/images/Dockerfile.tld
    image: l4stack/perception-tld:8.4.104-cu13.0
    shm_size: 1gb

  maptr-worker:
    <<: *gpu-common
    container_name: l4stack-perception-maptr
    build:
      context: ../..
      dockerfile: infra/perception/images/Dockerfile.pytorch
    image: l4stack/perception-pytorch:2.12.1-cu13.0
    shm_size: 1gb
    environment:
      CUDA_MPS_PIPE_DIRECTORY: /tmp/nvidia-mps
      CUDA_MPS_LOG_DIRECTORY: /tmp/nvidia-log
      CUDA_MODULE_LOADING: LAZY
      PYTORCH_CUDA_ALLOC_CONF: backend:cudaMallocAsync,expandable_segments:True
      TORCH_CUDA_ARCH_LIST: "12.0"
      L4STACK_REQUIRE_CUDA: "1"
      L4STACK_DISABLE_CPU_FALLBACK: "1"
      L4STACK_MIN_COMPUTE_CAPABILITY: "12.0"
